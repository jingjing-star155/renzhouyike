<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人周一课 - 运营管理</title>
  <style>
    :root {
      --nav: #303545;
      --nav-active: #ff6266;
      --page: #eef0f3;
      --surface: #ffffff;
      --text: #364052;
      --muted: #8791a1;
      --line: #e3e7ed;
      --header: #f4f6f8;
      --accent: #ff6266;
      --accent-hover: #e95257;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .topbar { height: 54px; background: var(--nav); color: #fff; }
    .topbar-inner {
      height: 100%; width: 100%; margin: 0 auto; padding: 0 14px; position: relative;
      display: flex; align-items: center; justify-content: space-between; gap: 28px;
    }
    .brand {
      color: #fff; text-decoration: none; font-weight: 900; font-size: 27px;
      letter-spacing: 1px; line-height: 1; white-space: nowrap;
    }
    .brand i { color: #ffbd13; font-style: normal; display: inline-block; transform: skew(-16deg); }
    .main-nav {
      position: absolute; left: max(164px, calc((100vw - 1200px) / 2));
      display: flex; align-items: stretch; height: 100%; margin-left: 0;
    }
    .main-nav a {
      color: #fff; text-decoration: none; padding: 0 18px; display: flex; align-items: center;
      border-bottom: 3px solid transparent; white-space: nowrap; font-size: 13px;
    }
    .main-nav a:hover, .main-nav a.active { border-bottom-color: var(--accent); color: #fff; }
    .main-nav a.accelerator { padding-left: 18px; padding-right: 0; }

    .admin-nav { background: #eaedf1; }
    .admin-nav-inner {
      width: 100%; max-width: 1480px; margin: 0 auto; display: flex; align-items: stretch;
      justify-content: space-between; overflow: hidden; padding: 0 20px;
    }
    .admin-nav a {
      color: #8a94a4; text-decoration: none; padding: 20px 12px 16px; white-space: nowrap;
      border-top: 3px solid transparent;
    }
    .admin-nav a:hover { color: #596477; }
    .admin-nav a.active { background: #fff; color: #7f8998; border-top-color: transparent; }

    .page-shell { max-width: 1200px; margin: 0 auto 64px; background: var(--surface); min-height: 586px; }
    .tabs { border-bottom: 1px solid var(--line); display: flex; padding: 0 46px; overflow-x: auto; }
    .tab {
      position: relative; padding: 21px 38px 18px; background: transparent; border: 0;
      color: #8a94a4; white-space: nowrap;
    }
    .tab.active { color: var(--accent); }
    .tab.active::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: -1px; height: 3px; background: var(--accent); }
    .content { padding: 50px 20px 54px; }
    .toolbar { height: 64px; display: flex; justify-content: flex-end; align-items: flex-start; }
    .primary-btn, .secondary-btn, .text-btn, .page-btn {
      border-radius: 5px; border: 1px solid transparent; transition: .18s ease;
    }
    .primary-btn { background: var(--accent); color: #fff; padding: 11px 30px; font-weight: 600; }
    .primary-btn:hover { background: var(--accent-hover); }
    .secondary-btn { background: #fff; color: #657084; border-color: #d7dde6; padding: 9px 19px; }
    .secondary-btn:hover { border-color: #aeb8c6; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 860px; border-collapse: collapse; table-layout: fixed; }
    th, td { height: 47px; padding: 9px 12px; border: 1px solid var(--line); text-align: center; font-weight: 400; }
    th { background: var(--header); color: #3f4857; }
    td { color: #58657a; background: #fff; }
    tbody tr:nth-child(even) td { background: #fbfcfd; }
    .course-name { color: #596779; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .text-btn:hover { color: var(--accent); }
    .text-btn { border: 0; background: transparent; color: #596779; padding: 4px; }
    .text-btn + .text-btn { margin-left: 8px; }
    .pagination { display: flex; align-items: center; gap: 10px; margin-top: 20px; color: #647086; }
    .page-btn { min-width: 28px; height: 25px; color: #657084; background: #fff; border-color: transparent; padding: 0 6px; }
    .page-btn:hover:not(:disabled), .page-btn.active { color: var(--accent); border-color: var(--accent); }
    .page-btn:disabled { cursor: default; color: #b5bdc9; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(28, 35, 49, .42); display: none; place-items: center; padding: 20px; z-index: 10; }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(540px, 100%); background: #fff; border-radius: 7px; box-shadow: 0 16px 48px rgba(0,0,0,.22); }
    .modal-head { padding: 17px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 16px; font-weight: 600; }
    .close { border: 0; background: transparent; color: #97a1b0; font-size: 22px; line-height: 1; }
    .modal-body { padding: 23px 24px; }
    .form-row { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 12px; margin-bottom: 16px; }
    .form-row[hidden] { display: none; }
    .form-row label { color: #535f70; text-align: right; }
    .form-row label em { color: var(--accent); font-style: normal; margin-right: 3px; }
    .form-row input, .form-row select { min-width: 0; border: 1px solid #d9dfe8; border-radius: 4px; padding: 9px 10px; outline: none; color: #435066; }
    .form-row input:focus, .form-row select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,98,102,.1); }
    .modal-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--line); }
    .empty { padding: 46px 0; text-align: center; color: #9ba4b2; }

    @media (max-width: 920px) {
      .topbar { height: auto; }
      .topbar-inner { min-height: 54px; padding: 0 16px; flex-wrap: wrap; gap: 0; }
      .main-nav { position: static; order: 3; width: 100%; overflow-x: auto; height: 46px; }
      .main-nav a { padding: 0 13px; }
      .accelerator { display: none; }
      .admin-nav-inner { justify-content: flex-start; overflow-x: auto; padding: 0 12px; scrollbar-width: none; }
      .admin-nav-inner::-webkit-scrollbar { display: none; }
      .page-shell { margin: 0; min-height: calc(100vh - 100px); }
      .tabs { padding: 0 8px; }
      .tab { padding-left: 22px; padding-right: 22px; }
      .content { padding: 28px 14px 40px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="courses-v2.html">人周<i>一</i>课</a>
      <nav class="main-nav" aria-label="主导航">
        <a href="my-learning.html">我的学习</a><a href="courses-v2.html">课程</a><a href="#">开课</a><a href="#">课外学习</a><a href="#">心愿墙</a><a href="#">团队学习</a><a class="active" href="admin-video-course.html">后台管理</a><a class="accelerator" href="#">◉ 完美加速器</a>
      </nav>
    </div>
  </header>

  <nav class="admin-nav" aria-label="后台管理导航">
    <div class="admin-nav-inner">
      <a href="#">公司课程管理</a><a href="#">自助开课管理</a><a href="admin-video-course.html">视频课程管理</a><a href="admin-series.html">系列课程管理</a><a href="#">课堂学习记录</a><a href="#">课外学习记录</a><a href="#">课程评价管理</a><a href="#">心愿管理</a><a class="active" href="admin-course-recommendation.html">运营管理</a><a href="#">系统设置</a><a href="#">课后回顾记录</a><a href="admin-course-comments.html">课程评论管理</a>
    </div>
  </nav>

  <main class="page-shell">
    <div class="tabs" role="tablist" aria-label="运营管理功能">
      <button class="tab" type="button" data-tab="carousel">轮播图管理</button>
      <button class="tab active" type="button" data-tab="recommendation">课程推荐</button>
      <button class="tab" type="button" data-tab="pinned">视频课程置顶</button>
    </div>
    <section class="content">
      <div class="toolbar"><button class="primary-btn" id="addButton" type="button">新增</button></div>
      <div class="table-wrap">
        <table aria-label="课程推荐列表">
          <thead><tr><th style="width:10%">排序</th><th style="width:12%">课程ID</th><th style="width:13%">上课方式</th><th style="width:38%">课程名称</th><th style="width:13%">显示位置</th><th style="width:14%">操作</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <nav class="pagination" aria-label="分页"><button class="page-btn" id="first" type="button">首页</button><button class="page-btn" id="prev" type="button">上一页</button><span id="pageNumbers"></span><button class="page-btn" id="next" type="button">下一页</button><button class="page-btn" id="last" type="button">末页</button></nav>
    </section>
  </main>

  <div class="modal-backdrop" id="editorBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <div class="modal-head"><strong class="modal-title" id="editorTitle">新增课程推荐</strong><button class="close" type="button" data-close="editorBackdrop" aria-label="关闭">×</button></div>
      <form id="courseForm">
        <div class="modal-body">
          <div class="form-row"><label for="isSeries"><em>*</em>是否系列课程</label><select id="isSeries" name="isSeries"><option value="false">否</option><option value="true">是</option></select></div>
          <div class="form-row" id="deliveryRow"><label for="delivery"><em>*</em>上课方式</label><select id="delivery" name="delivery"><option>视频</option><option>线下/直播</option></select></div>
          <div class="form-row"><label for="courseId"><em>*</em>课程ID</label><input id="courseId" name="courseId" required></div>
          <div class="form-row"><label for="placement"><em>*</em>显示位置</label><select id="placement" name="placement"><option>PC</option><option>移动端</option><option>全部</option></select></div>
          <div class="form-row"><label for="sort"><em>*</em>排序</label><input id="sort" name="sort" type="number" min="1" required></div>
        </div>
        <div class="modal-foot"><button class="secondary-btn" type="button" data-close="editorBackdrop">取消</button><button class="primary-btn" type="submit">保存</button></div>
      </form>
    </div>
  </div>

  <script>
    const dataByTab = {
      recommendation: [
        { sort: 2, id: '841', delivery: '视频', name: '植物生命之理，致知道化之道', placement: 'PC' },
        { sort: 1, id: '839', delivery: '视频', name: '如何拥有主动的人生？面对逆境也有选择权的人生', placement: 'PC' },
        { sort: 6, id: '65848', delivery: '线下/直播', name: '团队领导力：从协作到影响', placement: '移动端' },
        { sort: 5, id: '104', delivery: '线下/直播', name: '游戏市场营销通用基础理念', placement: '移动端' },
        { sort: 3, id: '49864', delivery: '线下/直播', name: '市场公开课——理念篇：客户洞察是商业成功的引擎', placement: '移动端' },
        { sort: 4, id: '64210', delivery: '视频', name: '产品经理核心能力：用户价值与商业判断', placement: 'PC' }
      ],
      carousel: [
        { sort: 1, id: 'B001', delivery: '视频', name: '夏日学习季：优质课程限时推荐', placement: 'PC' },
        { sort: 2, id: 'B002', delivery: '线下/直播', name: '管理者能力提升公开课', placement: '移动端' }
      ],
      pinned: [
        { sort: 1, id: 'V201', delivery: '视频', name: 'Python数据分析实战', placement: 'PC' },
        { sort: 2, id: 'V305', delivery: '视频', name: 'AI技术入门与实践', placement: 'PC' }
      ]
    };

    const labels = { carousel: '轮播图管理', recommendation: '课程推荐', pinned: '视频课程置顶' };
    let activeTab = 'recommendation';
    let page = 1;
    const pageSize = 5;
    let editingIndex = null;

    function activeData() { return dataByTab[activeTab]; }
    function render() {
      const rows = activeData().slice().sort((a, b) => a.sort - b.sort);
      const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
      page = Math.min(page, totalPages);
      const visible = rows.slice((page - 1) * pageSize, page * pageSize);
      document.getElementById('tableBody').innerHTML = visible.length ? visible.map(item => {
        const index = activeData().indexOf(item);
        return `<tr><td>${item.sort}</td><td>${item.id}</td><td>${item.isSeries ? '系列课程' : item.delivery}</td><td class="course-name" title="${item.name}">${item.name}</td><td>${item.placement}</td><td><button class="text-btn" type="button" data-edit="${index}">修改</button><button class="text-btn" type="button" data-delete="${index}">删除</button></td></tr>`;
      }).join('') : '<tr><td class="empty" colspan="6">暂无数据</td></tr>';
      document.getElementById('pageNumbers').innerHTML = Array.from({ length: totalPages }, (_, i) => `<button class="page-btn ${i + 1 === page ? 'active' : ''}" type="button" data-page="${i + 1}">${i + 1}</button>`).join('');
      document.getElementById('prev').disabled = page === 1;
      document.getElementById('first').disabled = page === 1;
      document.getElementById('next').disabled = page === totalPages;
      document.getElementById('last').disabled = page === totalPages;
    }

    function openModal(id) { const modal = document.getElementById(id); modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); }
    function closeModal(id) { const modal = document.getElementById(id); modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); }
    function openEditor(index = null) {
      editingIndex = index;
      const item = index === null ? { sort: activeData().length + 1, id: '', delivery: '视频', isSeries: false, name: '', placement: 'PC' } : activeData()[index];
      document.getElementById('editorTitle').textContent = index === null ? `新增${labels[activeTab]}` : `修改${labels[activeTab]}`;
      document.getElementById('isSeries').value = String(Boolean(item.isSeries));
      document.getElementById('delivery').value = item.delivery;
      document.getElementById('courseId').value = item.id;
      document.getElementById('placement').value = item.placement;
      document.getElementById('sort').value = item.sort;
      updateDeliveryVisibility();
      openModal('editorBackdrop');
      setTimeout(() => document.getElementById('sort').focus(), 0);
    }

    document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => {
      activeTab = button.dataset.tab; page = 1;
      document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab === button));
      render();
    }));
    document.getElementById('addButton').addEventListener('click', () => openEditor());
    document.getElementById('tableBody').addEventListener('click', event => {
      const button = event.target.closest('button'); if (!button) return;
      const index = Number(button.dataset.edit ?? button.dataset.delete);
      if (button.dataset.edit !== undefined) openEditor(index);
      else if (button.dataset.delete !== undefined && window.confirm(`确定删除「${activeData()[index].name}」吗？`)) { activeData().splice(index, 1); render(); }
    });
    document.getElementById('courseForm').addEventListener('submit', event => {
      event.preventDefault(); const form = new FormData(event.currentTarget);
      const id = form.get('courseId').trim();
      const isSeries = form.get('isSeries') === 'true';
      const current = editingIndex === null ? null : activeData()[editingIndex];
      const item = { sort: Number(form.get('sort')), id, delivery: form.get('delivery'), isSeries, name: current ? current.name : `课程ID ${id}`, placement: form.get('placement') };
      if (editingIndex === null) activeData().push(item); else activeData()[editingIndex] = item;
      closeModal('editorBackdrop'); render();
    });
    document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => closeModal(button.dataset.close)));
    function updateDeliveryVisibility() {
      document.getElementById('deliveryRow').hidden = document.getElementById('isSeries').value === 'true';
    }
    document.getElementById('isSeries').addEventListener('change', updateDeliveryVisibility);
    document.querySelectorAll('.modal-backdrop').forEach(backdrop => backdrop.addEventListener('click', event => { if (event.target === backdrop) closeModal(backdrop.id); }));
    document.getElementById('first').addEventListener('click', () => { page = 1; render(); });
    document.getElementById('last').addEventListener('click', () => { page = Math.max(1, Math.ceil(activeData().length / pageSize)); render(); });
    document.getElementById('prev').addEventListener('click', () => { page--; render(); });
    document.getElementById('next').addEventListener('click', () => { page++; render(); });
    document.getElementById('pageNumbers').addEventListener('click', event => { const target = event.target.closest('[data-page]'); if (target) { page = Number(target.dataset.page); render(); } });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') document.querySelectorAll('.modal-backdrop.open').forEach(modal => closeModal(modal.id)); });
    render();
  </script>
  <script src="page-navigation.js"></script>
</body>
</html>
